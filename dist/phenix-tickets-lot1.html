<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM NETCOM - TICKETS PHENIX (maquette lot 1)</title>
<style>
/* Reproduction de l'habillage du CRM Netcom (sb-admin / Bootstrap 3).
   Couleurs relevées dans sb-admin.css et dans la page TicketsConsulter.aspx. */
:root {
  color-scheme: light; /* le CRM est clair uniquement : la maquette reste fidèle */
  --nc-orange: #EB6200;
  --nc-orange-vif: #E34C00;
  --nc-orange-brule: #A64800;
  --nc-rose: #E22371;
  --nc-peche: #FECF91;
  --nc-saumon: #FCB475;
  --nc-creme: #FFE2AF;
  --nc-creme-clair: #FFF3E2;
  --nc-gris-entete: #5B5B5B;
  --nc-gris-nav: #282828;
  --nc-gris-ariane: #DCDCDC;
  --nc-texte: #333333;
  --nc-lien: #337AB7;
  --nc-focus: #1F6FB2;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--nc-peche);
  color: var(--nc-texte);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.42857;
}
a { color: var(--nc-lien); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--nc-focus); outline-offset: 1px; }

/* ---------- En-tête orange ---------- */
.nc-top {
  display: flex;
  align-items: stretch;
  height: 72px;
  background: var(--nc-orange);
  color: #fff;
}
.nc-logo { width: 225px; flex: none; display: flex; align-items: center; padding-left: 10px; }
.nc-logo img { height: 54px; width: auto; display: block; }
.nc-raccourcis { display: flex; }
.nc-raccourcis img { height: 72px; width: auto; display: block; opacity: .95; }
.nc-raccourcis a:hover img { opacity: 1; filter: brightness(1.08); }
.nc-espace { flex: 1; }
.nc-mdp { display: flex; align-items: center; padding: 0 30px; font-style: italic; font-size: 13px; text-align: center; line-height: 1.35; }
.nc-identite {
  display: flex; align-items: center; gap: 10px;
  background: var(--nc-gris-entete);
  padding: 0 14px;
  min-width: 200px;
  font-size: 11px;
  line-height: 1.5;
}
.nc-identite img { width: 50px; height: 50px; border-radius: 50%; display: block; }
.nc-identite i { display: block; }
.nc-identite b { display: block; font-size: 11px; }

/* ---------- Barre menu rapide + fil d'Ariane ---------- */
.nc-barre { display: flex; height: 28px; position: relative; }
.nc-menu-rapide { width: 225px; flex: none; background: var(--nc-gris-entete); position: relative; }
.nc-menu-rapide > button {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: space-between;
  background: none; border: 0; color: #fff;
  font-size: 12px; font-weight: bold; padding: 0 10px; cursor: pointer;
}
.nc-menu-rapide > button span { color: #bbb; font-size: 10px; }
.nc-menu-rapide > button:hover span { color: #fff; }
.nc-menu-liste {
  position: absolute; top: 100%; left: 0; z-index: 30;
  width: 225px; margin: 0; padding: 0; list-style: none;
  background: var(--nc-gris-nav);
  box-shadow: 2px 4px 10px rgba(0, 0, 0, .35);
}
.nc-menu-liste a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; color: var(--nc-orange-vif);
  border-bottom: 2px groove #777;
  font-size: 12px;
}
.nc-menu-liste a:hover { background: #3a3a3a; text-decoration: none; }
.nc-menu-liste a[aria-current="page"] { background: #3a3a3a; }
.nc-ariane {
  flex: 1; background: var(--nc-gris-ariane);
  display: flex; align-items: center; padding: 0 22px;
  font-family: Verdana, Geneva, sans-serif; font-weight: bold; font-size: 11px;
  color: var(--nc-orange); white-space: nowrap; overflow: hidden;
}
.nc-ariane a { color: var(--nc-orange); }
.nc-ariane .sep { margin: 0 4px; }

/* ---------- Bandeau rose ---------- */
.nc-bandeau {
  background: var(--nc-rose); color: #fff;
  line-height: 36px; padding: 0 15px; font-size: 14px; font-weight: bold;
  display: flex; align-items: center; gap: 6px;
}
.nc-bandeau img { width: 24px; height: 24px; }

/* ---------- Zone de contenu ---------- */
.nc-page { background: #fff; padding: 6px 15px 40px; min-height: calc(100vh - 136px); }
.nc-titre { display: flex; align-items: center; gap: 8px; margin: 8px 0 14px; flex-wrap: wrap; }
.nc-titre img { height: 25px; }
.nc-titre h4 { margin: 0; font-size: 18px; color: var(--nc-orange); }
.nc-titre .nc-sous-titre { font-size: 14px; color: #777; font-weight: normal; }
.nc-titre .nc-titre-liens { margin-left: auto; display: flex; gap: 6px; }

/* Boutons « classiques » du CRM */
.nc-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(#fafafa, #e6e6e6);
  border: 1px solid #a9a9a9; border-radius: 2px;
  color: #222; padding: 3px 10px; font-size: 13px; cursor: pointer; line-height: 1.4;
}
.nc-btn:hover { background: linear-gradient(#fff, #ececec); border-color: #888; text-decoration: none; }
.nc-btn:disabled { opacity: .5; cursor: default; }
.nc-btn-orange { background: var(--nc-orange); border-color: #c85400; color: #fff; }
.nc-btn-orange:hover { background: var(--nc-orange-vif); border-color: #b04400; }

/* Tuiles de menu (onglet-item Netcom) */
.nc-tuiles { display: flex; gap: 30px; padding: 30px 10px 20px; flex-wrap: wrap; }
.nc-tuile { width: 150px; text-align: center; font-size: 12px; color: #000; display: block; padding: 6px 0; }
.nc-tuile svg { display: block; margin: 0 auto 14px; transition: transform .15s ease; }
.nc-tuile:hover { text-decoration: none; }
.nc-tuile:hover svg { transform: scale(1.2); }
.nc-tuile b { display: block; font-size: 13px; }
.nc-tuile small { display: block; color: #777; margin-top: 3px; }

@media (prefers-reduced-motion: reduce) { .nc-tuile svg { transition: none; } }

@media (max-width: 1100px) {
  .nc-raccourcis, .nc-mdp { display: none; }
}
@media (max-width: 640px) {
  .nc-logo { width: auto; }
  .nc-identite { min-width: 0; }
  .nc-identite div { display: none; }
  .nc-menu-rapide { width: 130px; }
  .nc-ariane { padding: 0 10px; }
}

</style>
<style>
/* Module Tickets Phenix – styles propres au lot 1 */
:root {
  --st-ouv: #2A6DB0;
  --st-arp: #0F7F80;
  --st-aar: #8A4FB0;
  --st-res: #2F8F4E;
  --st-rej: #C0392B;
  --st-fer: #6D6D6D;
}

/* ---------- Barre de filtres orange (side-nav-ticket) ---------- */
.nc-filtres {
  list-style: none; margin: 0; padding: 6px 4px;
  background: var(--nc-orange); color: #fff;
  display: flex; flex-wrap: wrap; align-items: center;
  font-size: 12px;
}
.nc-filtres li { display: flex; align-items: center; gap: 6px; margin: 5px 10px; }
.nc-filtres b { white-space: nowrap; }
.nc-filtres input, .nc-filtres select {
  height: 22px; color: #000; font-size: 12px;
  border: 1px solid #c85400; background: #fff; padding: 0 3px;
}
.nc-filtres input[type="text"] { width: 90px; }
.nc-filtres input.large { width: 170px; }
.nc-filtres select { max-width: 190px; }
.nc-filtres select:disabled { background: #f3f3f3; color: #888; }
.nc-filtres input[type="date"] { width: 125px; }

.nc-actions { display: flex; align-items: center; gap: 8px; padding: 12px 0 4px; flex-wrap: wrap; }
.nc-actions .nc-aide { color: #FF8000; font-size: 12px; }

/* ---------- Barre d'outils au-dessus de la grille ---------- */
.nc-outils {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 0 8px; font-size: 13px;
}
.nc-outils .nc-compte b { color: var(--nc-orange); font-size: 15px; }
.nc-outils .nc-droite { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nc-outils select { height: 24px; }
.nc-pastille {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--nc-orange-brule); color: #fff; font-size: 11px; font-weight: bold; line-height: 18px; text-align: center;
}
.nc-filtres-actifs { font-size: 12px; color: #666; }

/* ---------- Grille des tickets ---------- */
.nc-grille-wrap { overflow-x: auto; border: 1px solid #e3b98a; }
.nc-grille { border-collapse: collapse; width: 100%; font-size: 12px; }
.nc-grille th {
  background: var(--nc-orange); color: #fff; text-align: left; font-weight: bold;
  padding: 7px 8px; white-space: nowrap; border-right: 1px solid #f08a3c;
  cursor: pointer; user-select: none; position: relative;
}
.nc-grille th.perso { background: var(--nc-orange-brule); border-right-color: #bf6420; }
.nc-grille th:hover { filter: brightness(1.07); }
.nc-grille th .tri { font-size: 9px; margin-left: 4px; opacity: .9; }
.nc-grille th .info { font-weight: normal; opacity: .8; margin-left: 3px; }
.nc-grille td { padding: 5px 8px; border-bottom: 1px solid #f2d5b0; white-space: nowrap; vertical-align: middle; background: #fff; }

/* Colonne « Ouvrir » : première colonne, figée lors du défilement horizontal */
.nc-grille th.col-ouvrir, .nc-grille td.col-ouvrir {
  position: sticky; left: 0; z-index: 1; width: 1%; padding: 4px 6px;
  box-shadow: inset -1px 0 0 #e3b98a;
}
.nc-grille th.col-ouvrir { cursor: default; z-index: 2; }
.nc-grille th.col-ouvrir:hover { filter: none; }
.nc-btn-ouvrir {
  display: inline-block; padding: 2px 10px; border: 1px solid var(--nc-orange); border-radius: 2px;
  background: #fff; color: var(--nc-orange); font-weight: bold; font-size: 12px; line-height: 1.4;
}
.nc-btn-ouvrir:hover, .nc-btn-ouvrir:focus-visible { background: var(--nc-orange); color: #fff; text-decoration: none; }
.nc-grille tbody tr:nth-child(even) td { background: var(--nc-creme-clair); }
.nc-grille tbody tr:hover td { background: var(--nc-creme); }
.nc-grille td.num { text-align: right; font-variant-numeric: tabular-nums; }
.nc-grille td.vide { color: #9a9a9a; }
.nc-grille td.objet { white-space: normal; min-width: 220px; max-width: 360px; }
.nc-grille a.lien-ticket { font-weight: bold; color: var(--nc-orange); }
.nc-non-affecte { color: #B03A2E; font-style: italic; }
.nc-vide-grille { padding: 30px; text-align: center; color: #666; background: #fff; }
.nc-vide-grille .nc-btn { margin-top: 10px; }
.nc-legende { font-size: 11px; color: #666; margin: 8px 0 0; }

/* Badges d'état */
.etat {
  display: inline-block; padding: 2px 7px; border-radius: 3px;
  color: #fff; font-weight: bold; font-size: 11px; white-space: nowrap; line-height: 1.5;
}
.etat-OUV { background: var(--st-ouv); }
.etat-ARP { background: var(--st-arp); }
.etat-AAR { background: var(--st-aar); }
.etat-RES { background: var(--st-res); }
.etat-REJ { background: var(--st-rej); }
.etat-FER { background: var(--st-fer); }

/* Pagination façon GridView */
.nc-pager { display: flex; gap: 4px; align-items: center; padding: 10px 0 0; flex-wrap: wrap; font-size: 12px; }
.nc-pager button {
  background: none; border: 1px solid transparent; color: var(--nc-orange); cursor: pointer;
  padding: 1px 7px; font-weight: bold;
}
.nc-pager button:hover { border-color: var(--nc-saumon); }
.nc-pager button[aria-current="page"] { color: #000; border-color: #ccc; background: #f7f7f7; cursor: default; }
.nc-pager button:disabled { color: #bbb; cursor: default; }
.nc-pager .info { margin-left: 8px; color: #777; font-weight: normal; }

/* ---------- Fenêtres modales ---------- */
.nc-modal-fond {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45);
  display: flex; align-items: flex-start; justify-content: center; padding: 50px 12px 12px; overflow-y: auto;
}
.nc-modal { background: #fff; width: 820px; max-width: 100%; border-radius: 4px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
.nc-modal-petit { width: 600px; }
.nc-modal-entete {
  background: var(--nc-orange-brule); color: #fff; padding: 10px 15px; border-radius: 4px 4px 0 0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.nc-modal-entete h2 { margin: 0; font-size: 16px; }
.nc-modal-entete button { background: none; border: 0; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; opacity: .8; }
.nc-modal-entete button:hover { opacity: 1; }
.nc-modal-corps { padding: 15px; font-size: 13px; }
.nc-modal-pied { display: flex; gap: 8px; align-items: center; padding: 10px 15px; border-top: 1px solid #e5e5e5; flex-wrap: wrap; }
.nc-modal-pied .flex { flex: 1; }
.nc-note { background: var(--nc-creme-clair); border-left: 3px solid var(--nc-orange); padding: 8px 10px; margin: 0 0 12px; font-size: 12px; }
.nc-note-verrou { background: #f4f4f4; border-left-color: #888; }

/* Sélecteur de colonnes (à la Redmine) */
.nc-picker { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 10px; align-items: start; }
.nc-picker label { display: block; font-weight: bold; margin-bottom: 4px; }
.nc-picker input[type="search"] { width: 100%; margin-bottom: 4px; height: 26px; padding: 0 6px; border: 1px solid #bbb; }
.nc-picker select { width: 100%; height: 300px; border: 1px solid #bbb; font-size: 12px; }
.nc-picker select optgroup { font-style: normal; color: var(--nc-orange-brule); }
.nc-picker select option { color: #222; padding: 2px 4px; }
.nc-picker select option:disabled { color: #8a8a8a; }
.nc-picker .fleches { display: flex; flex-direction: column; gap: 6px; padding-top: 58px; }
.nc-picker .fleches button { min-width: 36px; justify-content: center; }
@media (max-width: 720px) {
  .nc-picker { grid-template-columns: 1fr; }
  .nc-picker .fleches { flex-direction: row; padding-top: 0; justify-content: center; }
  .nc-picker select { height: 180px; }
}

/* ---------- Statistiques (style « Tickets Stat Général ») ---------- */
.st-grille { display: grid; gap: 20px; margin-top: 16px; grid-template-columns: minmax(0, 1fr); }
.st-grille > *, .st-ligne-3 > * { min-width: 0; }
.st-ligne-3 { display: grid; gap: 20px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1100px) { .st-ligne-3 { grid-template-columns: minmax(0, 1fr); } }
.st-wrap { overflow-x: auto; }
.st-table { border-collapse: collapse; width: 100%; background: var(--nc-saumon); border: 1px solid #8a8a8a; font-size: 13px; }
.st-table caption {
  caption-side: top; background: #fff; color: var(--nc-orange); font-weight: bold; font-size: 16px;
  padding: 6px; border: 1px solid #8a8a8a; border-bottom: 0;
}
.st-table th { background: #fff; color: #555; font-size: 12px; padding: 6px 8px; text-align: center; border-bottom: 1px solid #8a8a8a; }
.st-table th.g, .st-table td.g { text-align: left; }
.st-table td { padding: 6px 8px; text-align: center; height: 30px; }
.st-table tbody tr:nth-child(even) td { background: var(--nc-creme); }
.st-table tr.sous td { background: var(--nc-creme-clair) !important; font-size: 12px; }
.st-table tr.sous td.g { padding-left: 34px; }
.st-table tr.total td { background: #fff !important; font-weight: bold; border-top: 1px solid #8a8a8a; }
.st-table td.sep, .st-table th.sep { border-left: 2px solid #8a8a8a; }
.st-table a { font-weight: bold; color: var(--nc-lien); }
.st-table .zero { color: #9a7b5a; }
.st-table .deplier {
  background: none; border: 0; padding: 0 6px 0 0; cursor: pointer; font: inherit; color: #333; text-align: left;
}
.st-table .deplier:hover { text-decoration: underline; }
.st-table .deplier span { display: inline-block; width: 12px; font-size: 10px; color: var(--nc-orange-brule); }
.st-kv td.g { width: 60%; }
.st-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.st-ligne-agents { max-width: 760px; }
.st-kv td.v { text-align: right; font-weight: bold; font-variant-numeric: tabular-nums; }
.st-kv td.verrou { text-align: right; color: #666; font-style: italic; font-weight: normal; }
.st-aide { font-size: 11px; color: #666; margin: 6px 0 0; }

/* ---------- Panneau de simulation (hors maquette) ---------- */
.sim-bouton {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: #2b2b2b; color: #FFD54A; border: 2px dashed #FFD54A; border-radius: 4px;
  padding: 7px 12px; font-weight: bold; font-size: 13px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
}
.sim-panneau {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 45; width: 360px; max-width: 100%;
  background: #FFFBEA; border-left: 3px dashed #C9A400; box-shadow: -4px 0 16px rgba(0, 0, 0, .2);
  overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(70px + env(safe-area-inset-bottom, 0px));
  font-size: 13px;
}
.sim-panneau[hidden] { display: none; }
.sim-panneau h2 { font-size: 15px; margin: 0; }
.sim-panneau h3 { font-size: 13px; margin: 18px 0 6px; color: #6b5600; }
.sim-entete { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sim-entete button { background: none; border: 0; font-size: 22px; cursor: pointer; line-height: 1; }
.sim-sous { color: #6b5600; font-size: 12px; margin: 4px 0 0; }
.sim-panneau label.radio { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
.sim-panneau label.radio small { display: block; color: #666; }
.sim-form { display: grid; gap: 6px; }
.sim-form label { font-size: 12px; font-weight: bold; }
.sim-form input, .sim-form select { width: 100%; height: 26px; border: 1px solid #c9b46a; background: #fff; padding: 0 5px; }
.sim-form .check { display: flex; gap: 6px; align-items: center; font-weight: normal; }
.sim-form .check input { width: auto; height: auto; }
.sim-liste { list-style: none; margin: 6px 0 0; padding: 0; }
.sim-liste li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 6px; background: #fff; border: 1px solid #eadb9e; margin-bottom: 4px; font-size: 12px; }
.sim-liste button { background: none; border: 0; color: #B03A2E; cursor: pointer; font-size: 12px; }

/* Message éphémère */
.nc-toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: #333; color: #fff; padding: 8px 16px; border-radius: 3px; font-size: 13px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .3); max-width: 90vw;
}
.nc-toast[hidden] { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Fiche ticket (modèle « Tickets Répondre » Netcom) ---------- */
.tk-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tk-nav .tk-pos { font-size: 12px; color: #777; margin: 0 4px 0 10px; }
.tk-nav [aria-disabled="true"] { opacity: .45; cursor: default; }

.rp-entete { display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap; font-size: 14px; color: #666; padding: 2px 0 10px; border-bottom: 1px solid #eee; }
.rp-entete b { color: #444; }
.rp-entete .rp-num { color: var(--nc-orange); }
.rp-liens { display: flex; gap: 8px 40px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #eee; margin-bottom: 14px; font-size: 11px; }
.rp-liens a { color: #666; display: inline-flex; align-items: center; gap: 3px; }

/* Historique des échanges */
.rp-histo { border: 1px solid #fae9be; border-radius: 5px; padding: 15px; background: #fff; font-size: 13px; color: #666; margin-bottom: 18px; }
.rp-ev + .rp-ev { margin-top: 12px; }
.rp-ev-tete { background: #FD8030; color: #fff; padding: 2px 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rp-ev-saisie { margin-left: auto; background: #fff; color: #C25A10; font-size: 10px; font-weight: bold; padding: 0 6px; border-radius: 2px; }
.rp-ev dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 8px; margin: 4px 0 0; }
.rp-ev dt { font-weight: bold; color: #444; }
.rp-ev dd { margin: 0; }
.rp-modifs { margin: 0; padding-left: 16px; }
.rp-ev-flash { animation: rp-flash 2.4s ease-out; }
@keyframes rp-flash { from { box-shadow: 0 0 0 4px #ffc663; } to { box-shadow: 0 0 0 0 rgba(255, 198, 99, 0); } }
@media (prefers-reduced-motion: reduce) { .rp-ev-flash { animation: none; outline: 3px solid #ffc663; } }

/* Panneaux jaunes (Ticket N°, Notification par email) */
.rp-panneau { margin: 0 0 16px; }
.rp-panneau-tete { margin: 0; font-size: 12px; font-weight: bold; background: #ffc663; color: #fff; padding: 7px; border-radius: 5px 5px 0 0; }
.rp-panneau-corps { background: #fffdfa; border: 1px solid #fff263; border-top: 0; border-radius: 0 0 5px 5px; padding: 15px; font-size: 13px; color: #444; }
.rp-grille { display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px minmax(0, 1fr); gap: 10px 14px; align-items: start; }
.rp-grille > label, .rp-grille > .rp-lib { padding-top: 6px; }
.rp-grille > b { padding-top: 6px; }
.rp-large { grid-column: 2 / -1; }
.rp-large-tout { grid-column: 1 / -1; margin: 0; }
.rp-sec { grid-column: 1 / -1; background: #f7fce3; color: #555; font-weight: bold; padding: 6px 8px; margin-top: 8px; }
.rp-champ input, .rp-champ select {
  height: 30px; width: 100%; max-width: 290px; padding: 4px 8px; font-size: 12px; color: #333;
  background: #fff; border: 1px solid #ccc; border-radius: 3px; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
}
.rp-champ input:disabled, .rp-champ select:disabled { background: #eee; color: #555; }
.rp-champ.rp-modifie input, .rp-champ.rp-modifie select { border-color: #d9a400; background: #fff6d1; }
.rp-ligne { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rp-ligne select { flex: 1 1 180px; }
.rp-montant { display: flex; align-items: center; gap: 6px; max-width: 290px; }
.rp-montant input { flex: 1 1 auto; min-width: 0; }
.rp-unite { flex: none; white-space: nowrap; }
.rp-aide { font-size: 11px; color: #777; margin-top: 3px; }
.rp-lien-aide { font-size: 11px; margin-left: 4px; }
.rp-verrou { color: #666; display: inline-block; padding-top: 6px; }
.rp-nouveau { background: var(--nc-orange-brule); color: #fff; border-radius: 2px; padding: 0 4px; font-size: 10px; }
.req { color: #d00; }
.tk-err { color: #d00; font-weight: bold; font-size: 12px; }
.tk-err:empty { display: none; }
.rp-champ .tk-err { display: block; margin-top: 3px; }
.rp-champ .tk-err:empty { display: none; }

/* Commentaire */
.rp-commentaire { margin: 0 0 16px; }
.rp-commentaire label { display: inline-block; margin-bottom: 4px; color: #555; }
.rp-commentaire textarea { width: 100%; min-height: 140px; border: 1px solid #ccc; padding: 8px; font: inherit; font-size: 13px; resize: vertical; display: block; }
.rp-commentaire textarea:disabled { background: #f3f3f3; }

/* Notification par e-mail */
.rp-petit { font-size: 11px; color: #777; margin: 0 0 8px; }
.rp-groupe-tete {
  display: block; width: 100%; text-align: left; background: #f7fce3; border: 0; border-bottom: 1px solid #fff;
  color: gray; font-style: italic; font-size: 11px; padding: 5px 6px; cursor: pointer;
}
.rp-groupe-tete:hover { background: #eef7cf; }
.rp-groupe-corps { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 6px 10px 10px; font-weight: bold; color: #666; }
.rp-groupe-corps label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.rp-libres { margin-top: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rp-libres input { height: 28px; border: 1px solid #ccc; border-radius: 3px; padding: 3px 8px; width: 260px; max-width: 100%; }
.rp-chips { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
.rp-chip { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 1px solid #e3b98a; border-radius: 12px; padding: 1px 4px 1px 10px; font-size: 12px; }
.rp-chip button { border: 0; background: none; color: #B03A2E; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }

/* Pied : ENREGISTRER */
.rp-pied { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
.rp-resume { font-size: 12px; color: #8a6d00; min-height: 1em; text-align: center; }
.rp-resume.err { color: #d00; font-weight: bold; }
.rp-btn-enregistrer { background: #5cb85c; border: 1px solid #4cae4c; color: #fff; padding: 5px 10px; font-size: 12px; border-radius: 3px; min-width: 110px; cursor: pointer; }
.rp-btn-enregistrer:hover { background: #449d44; }
.rp-btn-enregistrer:disabled { opacity: .5; cursor: default; }
.rp-regles td { white-space: normal; }
.rp-regles td .etat { margin: 1px 2px; }
.rp-regles-liste { margin: 12px 0 0; padding-left: 18px; font-size: 13px; }
.rp-regles-liste li + li { margin-top: 4px; }

@media (max-width: 900px) {
  .rp-grille { grid-template-columns: 150px minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .rp-grille { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .rp-large { grid-column: auto; }
  .rp-grille > b { padding-top: 0; margin-bottom: 6px; }
}

/* ---------- Demandes de modification (modèle « Demandes Clients » Netcom) ---------- */
.sdm-ATT { background: #B7791F; }
.sdm-VAL { background: var(--st-ouv); }
.sdm-REA { background: var(--st-res); }
.sdm-REF { background: var(--st-rej); }
.sdm-ANN { background: var(--st-fer); }

.dm-entete { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; color: #666; margin: 0 0 12px; }
.dm-entete label { font-weight: bold; color: #555; }
.dm-entete .etat { margin-left: 4px; }
.dm-ro { width: 90px; height: 24px; border: 1px solid #ccc; background: #eee; color: #444; padding: 0 5px; }
.dm-reprise ul { margin: 4px 0 0; padding-left: 18px; }
.dm-reprise li + li { margin-top: 4px; }
.dm-reprise .nc-btn { margin-left: 6px; padding: 1px 8px; font-size: 12px; }

/* Accordéon des types de demande */
.dm-accordeon { margin: 8px 0 22px; }
.dm-acc + .dm-acc { margin-top: 1px; }
.dm-acc-h { margin: 0; font-size: inherit; }
.dm-acc-tete {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  background: #FF6600; color: #fff; border: 0; padding: 4px 8px; font-size: 13px; font-weight: bold; text-align: left; cursor: pointer;
}
.dm-acc-tete:hover { background: #E85C00; }
.dm-acc-tete:disabled { opacity: .55; cursor: default; }
.dm-acc-tete small { font-weight: normal; margin-left: 6px; }
.dm-nouveau { background: #fff; color: #C25A10; border-radius: 2px; padding: 0 4px; font-size: 10px; }
.dm-signe { font-size: 15px; width: 14px; text-align: center; }
.dm-acc-corps { border: 1px solid orange; border-top: 0; background: #F8F8F8; padding: 12px 14px; font-size: 13px; }
.dm-grille { display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px minmax(0, 1fr); gap: 10px 14px; align-items: start; }
.dm-grille > label { padding-top: 6px; color: #444; }
.dm-grille .dm-large { grid-column: 2 / -1; }
.dm-grille textarea { width: 100%; border: 1px solid #ccc; border-radius: 3px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical; }
.dm-grille .dm-case { width: auto; height: auto; margin-top: 8px; box-shadow: none; }
.dm-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.dm-actions .tk-err { margin-right: auto; }
.dm-prerempli { color: #8a6d00; margin: 0 0 8px; }

/* Filtres et grille des demandes */
.dm-titre-liste { color: #FF6600; font-size: 15px; margin: 0 0 8px; }
.dm-filtres {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) 150px minmax(0, 1fr); gap: 6px 12px; align-items: center;
  border: 1px solid orange; background: #F8F8F8; padding: 10px 12px; font-size: 13px; color: gray;
}
.dm-filtres input, .dm-filtres select { height: 24px; max-width: 240px; width: 100%; border: 1px solid #bbb; background: #fff; padding: 0 4px; font-size: 12px; color: #333; }
.dm-filtres-titre, .dm-filtres-sous { grid-column: 1 / -1; color: #777; }
.dm-filtres-sous { margin-top: 4px; font-style: italic; }
.dm-filtres-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
.dm-gv th { background: #DCDCDC; color: #FD8030; border-right: 1px solid #c8c8c8; }
.dm-gv th.col-ouvrir { background: #DCDCDC; }
.dm-gv td { border-bottom: 1px solid #ddd; }
.dm-gv tbody tr:nth-child(even) td { background: #EEEEEE; }
.dm-gv tbody tr:hover td { background: #FFF6D6; }
.dm-gv tbody tr.dm-surligne td { background: #FFFF99; }
.dm-gv-wrap { border-color: #ccc; }
.dm-gv button.nc-btn-ouvrir { cursor: pointer; font-family: inherit; }
.dm-com { text-align: center; }
.dm-com img { cursor: help; vertical-align: middle; }

/* Fiche d'une demande (fenêtre) */
.dm-fiche-tete { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.dm-fiche { display: grid; grid-template-columns: 190px minmax(0, 1fr); margin: 0; font-size: 13px; }
.dm-fiche dt, .dm-fiche dd { margin: 0; padding: 5px 8px; border-bottom: 1px solid #f0e0cc; }
.dm-fiche dt { font-weight: bold; color: #555; background: var(--nc-creme-clair); }
.dm-journal-titre { font-size: 13px; margin: 14px 0 6px; color: #555; }
.dm-journal { margin: 0; padding-left: 20px; font-size: 13px; }
.dm-journal li + li { margin-top: 6px; }
.dm-j-date { color: #777; margin-right: 4px; }
.dm-journal small { color: #888; }
.dm-maj { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; align-items: start; margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; }
.dm-maj label { padding-top: 5px; font-weight: bold; color: #555; }
.dm-maj select { height: 30px; max-width: 280px; border: 1px solid #ccc; border-radius: 3px; }
.dm-maj textarea { width: 100%; border: 1px solid #ccc; border-radius: 3px; padding: 6px 8px; font: inherit; font-size: 13px; }
.dm-maj .tk-err { grid-column: 2; }

/* Bloc « Demandes de modification rattachées » de la fiche ticket */
.rp-dm { border: 1px solid #fae9be; border-radius: 5px; padding: 12px 15px; background: #fff; margin: 0 0 18px; }
.rp-dm h3 { margin: 0 0 8px; font-size: 13px; color: #FD8030; }

@media (max-width: 900px) {
  .dm-grille, .dm-filtres { grid-template-columns: 150px minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .dm-grille, .dm-filtres, .dm-entete, .dm-fiche, .dm-maj { grid-template-columns: minmax(0, 1fr); }
  .dm-grille .dm-large, .dm-maj .tk-err { grid-column: auto; }
}
.dm-fige { display: inline-block; padding-top: 6px; color: #333; }

/* ---------- Fiche partenaire Phenix (PagesMB/PartnerDetails.aspx) ---------- */
body.fp-page .nc-bandeau { display: none; }
body.fp-page .nc-page { background: var(--nc-peche); }
.fp-titre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: #51bc91; font-size: 18px; font-weight: bold; padding: 5px 5px 8px; }
.fp-code { color: #3d9a74; font-size: 15px; }
.fp-onglets { background: #fff; }
.fp-onglets-tete { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; padding: 12px 0; }
.fp-onglet { text-align: center; font-size: 16px; font-weight: 600; color: #b5b5b5; padding: 2px 6px; }
.fp-onglet:hover { color: #8a8a8a; text-decoration: none; }
.fp-onglet.actif { color: #ff6a00; }
.fp-nouveau { display: inline-block; vertical-align: middle; background: #ff6a00; color: #fff; font-size: 10px; font-weight: bold; border-radius: 2px; padding: 0 5px; }
.fp-sep { height: 2px; background: #1f3fbf; }
.fp-contenu { padding: 20px 40px 30px; }
.fp-card { background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .22); border-radius: 2px; padding: 10px 15px 15px; margin: 0 0 18px; font-size: 12px; color: #5A5A5A; }
.fp-card-titre { display: flex; align-items: center; gap: 5px; color: #00a65a; font-size: 11px; font-weight: 600; margin: 0 0 12px; padding: 4px 0 9px; border-bottom: 1px solid #eee; }

/* Raccourcis Tickets / Demandes */
.fp-raccourcis { display: flex; gap: 20px; flex-wrap: wrap; padding: 4px 2px; }
.fp-raccourci { display: flex; align-items: center; gap: 14px; flex: 0 1 340px; padding: 12px 18px; border: 1px solid #e3e3e3; border-radius: 4px; background: #fff; color: #333; }
.fp-raccourci:hover { border-color: var(--nc-orange); text-decoration: none; }
.fp-raccourci:hover svg { transform: scale(1.08); }
.fp-raccourci svg { flex: none; transition: transform .15s ease; }
.fp-raccourci b { display: block; font-size: 14px; color: #222; }
.fp-raccourci small { display: block; font-size: 12px; color: #777; margin-top: 2px; }
.fp-raccourci.actif { border-color: var(--nc-orange); box-shadow: inset 0 -3px 0 var(--nc-orange); }
@media (prefers-reduced-motion: reduce) { .fp-raccourci svg { transition: none; } }

/* Onglet Détails partenaire (reproduction indicative) */
.fp-details { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; }
.fp-champs { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.fp-champs label { font-size: 11px; color: #5A5A5A; }
.fp-champs input { height: 32px; width: 100%; max-width: 390px; border: 1px solid #ccc; border-radius: 4px; padding: 4px 10px; font-size: 13px; color: #555; background: #f5f5f5; }
.fp-double { display: flex; gap: 10px; max-width: 390px; }
.fp-double input:first-child { flex: 0 0 38%; }
.fp-code-vert { color: #00a65a; font-size: 14px; }
.fp-cote { text-align: center; }
.fp-cote hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
.fp-case { display: flex; align-items: center; gap: 6px; text-align: left; font-weight: bold; font-size: 11px; color: #333; margin: 8px 0; }
.fp-boutons { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.fp-btn-rouge, .fp-btn-vert { border: 0; border-radius: 4px; color: #fff; padding: 6px 12px; font-size: 14px; opacity: .65; }
.fp-btn-rouge { background: #d9534f; }
.fp-btn-vert { background: #5cb85c; }

@media (max-width: 900px) {
  .fp-contenu { padding: 14px 12px 20px; }
  .fp-details { grid-template-columns: minmax(0, 1fr); }
  .fp-onglet { font-size: 13px; }
}
@media (max-width: 520px) {
  .fp-champs { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

/* ---------- Tickets du partenaire (modèle « Client Tickets » Netcom) ---------- */
.pt-cadre { background: #fffdfa; border: 1px solid #fff263; border-radius: 5px; padding: 10px 16px 18px; }
.pt-entete { display: flex; align-items: center; gap: 8px 30px; flex-wrap: wrap; padding: 28px 0 4px; font-size: 13px; color: #555; }
.pt-entete b { color: #333; }
.pt-titre { margin: 0; color: #FF9900; font-size: 16px; font-weight: bold; }
.pt-liens { margin-left: auto; display: flex; gap: 8px 20px; flex-wrap: wrap; }
.pt-liens a { display: inline-flex; align-items: center; gap: 4px; }
.pt-filtres { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: #666; }
.pt-filtres label { margin-left: 6px; }
.pt-filtres select, .pt-filtres input { height: 24px; border: 1px solid #ccc; background: #fff; font-size: 12px; padding: 0 4px; }
.pt-filtres .nc-btn { margin-left: auto; }
.pt-cadre hr { border: 0; border-top: 1px solid #eee; margin: 12px 0 14px; }
.pt-blocs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 34px; }
@media (max-width: 1000px) { .pt-blocs { grid-template-columns: minmax(0, 1fr); } }
.pt-bloc { min-width: 0; overflow-x: auto; }
.pt-bloc-titre { margin: 0 0 3px; font-size: 13px; font-weight: bold; color: #A89A00; }
.pt-bloc-titre small { font-weight: normal; color: #888; }
.pt-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.pt-table th { background: #e7b630; color: #fff; border: 1px solid #fff; border-radius: 5px; height: 26px; font-size: 13px; text-align: center; padding: 0 6px; }
.pt-c-num { width: 62px; }
.pt-c-sous { width: 140px; }
.pt-c-etat { width: 160px; }
.pt-table td { font-family: Verdana, Geneva, sans-serif; font-size: 11px; color: #555; padding: 3px 4px; vertical-align: top; }
.pt-table tr.pt-actif td { font-weight: bold; color: #222; }
.pt-table tbody tr:hover td { background: #fff3cf; }
.pt-vide { color: #999; font-style: italic; }
.pt-pager { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
.pt-pager button { min-width: 26px; padding: 5px 7px; color: #fff; background: #FF6600; border: 1px solid #666; border-radius: 5px; font: bold 8pt Tahoma, Geneva, sans-serif; cursor: pointer; }
.pt-pager button:hover { background: #E85C00; }
.pt-pager button[aria-current="page"] { background: #A64800; }
.pt-legende { font-size: 11px; color: #777; margin: 16px 0 0; }

/* ---------- Demandes de modification du partenaire (modèle « Client Demande de Modification ») ---------- */
.pd-cadre { background: #fff; padding: 12px 16px 20px; font-family: Verdana, Geneva, sans-serif; font-size: 12px; color: gray; }
.pd-section { display: flex; margin: 10px 0 4px; }
.pd-lib { flex: 0 0 178px; background: #fd8030; color: #fff; font-weight: bold; padding: 2px 6px; }
.pd-barre { flex: 1 1 auto; display: flex; justify-content: flex-end; align-items: center; gap: 12px; background: #cecece; padding: 1px 8px; }
.pd-barre a { color: #fff; }
.pd-csv { background: none; border: 0; color: #fff; font: inherit; font-weight: bold; cursor: pointer; padding: 0; }
.pd-csv:hover { text-decoration: underline; }
.pd-detail { display: grid; grid-template-columns: 290px minmax(0, 1fr); margin: 0 0 0 178px; }
.pd-detail dt, .pd-detail dd { margin: 0; padding: 1px 0; }
.pd-filtres { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin: 6px 0 6px 178px; }
.pd-filtres select, .pd-filtres input { height: 22px; border: 1px solid #bbb; font-size: 11px; background: #fff; }
.pd-cadre .nc-grille-wrap { margin-left: 178px; }
.pd-gv { font-family: Verdana, Geneva, sans-serif; }
.pd-gv th, .pd-gv td { border: 1px solid #b5b5b5; }
.pd-gv td { color: #666; }
.pd-gv td.pd-c { text-align: center; }
.pd-details { border: 1px solid #808080; background: #EEEEEE; color: #000; cursor: pointer; padding: 0 3px; font: inherit; }
.pd-details:hover { background: #ddd; }
.pd-note { margin: 10px 0 0 178px; }
@media (max-width: 900px) {
  .pd-detail, .pd-filtres, .pd-cadre .nc-grille-wrap, .pd-note { margin-left: 0; }
  .pd-detail { grid-template-columns: 150px minmax(0, 1fr); }
  .pd-lib { flex-basis: 150px; }
}

/* ---------- Gestion des demandes de modification (modèle « Consulter les Demandes » Netcom) ---------- */
.gd-sections { margin-top: 26px; }
.gd-section { margin: 0 0 22px; }
.gd-titre { margin: 0 0 6px; color: #FF6600; font-size: 16px; font-weight: bold; }
.gd-titre small { font-size: 12px; font-weight: normal; color: #999; }
.gd-gv { font-family: Verdana, Geneva, sans-serif; }
.gd-gv th, .gd-gv td { border: 1px solid #c8c8c8; }
.gd-vide { border: 1px solid #b5b5b5; padding: 3px 6px; font-family: Verdana, Geneva, sans-serif; font-size: 12px; color: gray; }

@media print {
  .nc-top, .nc-barre, .nc-bandeau, .sim-bouton, .sim-panneau, .nc-toast, .dm-filtres, .nc-outils .nc-droite, .nc-pager, .nc-titre-liens, .col-ouvrir, .pd-details { display: none !important; }
  body, .nc-page { background: #fff !important; }
  .nc-grille-wrap { overflow: visible; border: 0; }
}

/* Champ à choix multiple (ex. Services impactés) */
.rp-multi { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-top: 5px; }
.rp-multi label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.rp-multi[data-disabled] label { cursor: default; color: #777; }
.rp-champ.rp-modifie .rp-multi { background: #fff6d1; outline: 1px solid #d9a400; outline-offset: 3px; }

/* ---------- Création de ticket (modèle « Réception tickets » Netcom) ---------- */
.ct-cadre { max-width: 1000px; background: #e6e6e6; padding: 10px 10px 14px; font-size: 13px; color: #666; }
.ct-lib { color: #D98200; font-weight: bold; }
.ct-ligne { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.ct-ligne input { width: 230px; height: 26px; border: 1px solid #aaa; padding: 0 6px; font-size: 13px; background: #fff; }
.ct-rs { background: #d3d3d3; font-weight: bold; color: #444; padding: 1px 8px; }
.ct-rs:empty { display: none; }
.ct-consigne { margin: 10px 0 6px; }
.ct-onglets { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 3px; }
.ct-tabs { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px 4px 0; background: linear-gradient(#f9b44a, #f6a828); border: 1px solid #e78f08; border-radius: 4px; }
.ct-tab {
  margin-bottom: -1px; padding: 7px 14px; border: 1px solid #ccc; border-bottom: 0; border-radius: 4px 4px 0 0;
  background: #f6f6f6; color: #1c94c4; font: bold 14px Arial, Helvetica, sans-serif; cursor: pointer;
}
.ct-tab:hover { background: #fdf5ce; }
.ct-tab[aria-selected="true"] { background: #fff; color: #eb8f00; border-color: #fbd850; }
.ct-panneau { background: #eee; padding: 14px 16px; }
.ct-panneau textarea { width: 100%; border: 1px solid #ccc; border-radius: 3px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical; background: #fff; }
.ct-commun { margin-top: 12px; padding: 0 6px; }
.ct-notif { max-width: 1000px; margin-top: 14px; }
.rp-pied .rp-petit { margin: 0; }
.ct-panneau .ct-col1 { grid-column: 1; }
.ct-pied { max-width: 1000px; }
@media (max-width: 520px) { .ct-panneau .ct-col1 { grid-column: auto; } }

/* ---------- Statistiques : sections, graphique mensuel, tables Recouvrement ---------- */
.st-periode { margin-left: 12px; font-size: 13px; color: #555; }
.st-section { margin: 22px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--nc-orange); color: var(--nc-orange); font-size: 16px; }
.st-invite { margin-top: 18px; font-size: 13px; }
.st-bloc { border: 1px solid #8a8a8a; background: #fff; padding: 0 12px 10px; }
.st-cap { margin: 0 -12px 8px; padding: 6px; text-align: center; color: var(--nc-orange); font-size: 16px; border-bottom: 1px solid #8a8a8a; }
.st-legende { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #444; margin: 4px 0 6px; }
.st-legende span { display: inline-flex; align-items: center; gap: 6px; }
.st-legende i { display: inline-block; width: 14px; height: 12px; border-radius: 2px; }
.st-graph-wrap { border: 0; }
.st-graph { display: block; max-width: none; height: auto; }
.st-donnees { margin-top: 6px; font-size: 12px; }
.st-donnees summary { cursor: pointer; color: var(--nc-lien); }
.st-mini td, .st-mini th { padding: 3px 6px; height: auto; font-size: 12px; }
.st-ligne-2 { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.st-ligne-2 > * { min-width: 0; }
@media (max-width: 1000px) { .st-ligne-2 { grid-template-columns: minmax(0, 1fr); } }
.st-kpi-wrap { max-width: 760px; }
.st-kv tr.st-sous-kv td { background: var(--nc-creme-clair) !important; font-size: 12px; }
.st-kv tr.st-sous-kv td.g { padding-left: 28px; }
.st-kv tr.st-total-kv td { background: #fff !important; font-weight: bold; border-top: 1px solid #8a8a8a; }
.st-liste td { font-size: 12px; height: auto; padding: 4px 6px; white-space: nowrap; }
.st-liste td.g { white-space: normal; }
.st-liste .etat { font-size: 10px; }

</style>
</head>

<script>
/*
 * Phenix – Module Tickets – Lot 1
 * Référentiel métier utilisé par la maquette.
 *
 * Point clé pour l'équipe SI : les colonnes proposées dans « Colonnes… »
 * ne sont PAS codées en dur dans la table. Elles sont lues dans le
 * catalogue des champs ci-dessous (PHX.CHAMPS_BASE). Ajouter un champ au
 * catalogue suffit pour qu'il devienne une colonne sélectionnable,
 * exportable en .csv, sans toucher à l'écran.
 */
(function () {
  'use strict';
  var PHX = (window.PHX = window.PHX || {});

  /* ---------- Typologies et sous-typologies (CDC § 4.2 et § 4.4) ---------- */
  PHX.TYPOLOGIES = [
    {
      code: 'REC', libelle: 'Réclamation',
      sous: [
        { code: 'FAC', libelle: 'Facturation', boite: 'reclamations@phenix-partner.fr' },
        { code: 'SAV', libelle: 'SAV', boite: 'reclamations@phenix-partner.fr' },
        { code: 'DEP', libelle: 'Déploiement', boite: 'reclamations@phenix-partner.fr' },
        { code: 'AUT', libelle: 'Autre', boite: 'reclamations@phenix-partner.fr' }
      ]
    },
    {
      code: 'DEP', libelle: 'Déploiement',
      sous: [
        { code: 'DATA', libelle: 'DATA', boite: 'delivery@phenix-partner.fr' },
        { code: 'VOIP', libelle: 'VOIP', boite: 'delivery@phenix-partner.fr' },
        { code: 'GSM', libelle: 'GSM', boite: 'mobility@phenix-partner.fr' }
      ]
    },
    {
      code: 'FAC', libelle: 'Facturation',
      sous: [
        { code: 'EDI', libelle: 'Édition factures divers', boite: 'facturation@phenix-partner.fr' },
        { code: 'AVO', libelle: 'Avoir', boite: 'facturation@phenix-partner.fr' }
      ]
    },
    {
      code: 'RCV', libelle: 'Recouvrement',
      sous: [
        { code: 'IMP', libelle: 'Impayés', boite: 'recouvrement@phenix-partner.fr' },
        { code: 'REJ', libelle: 'Rejet de prélèvement', boite: 'recouvrement@phenix-partner.fr' }
      ]
    },
    {
      // Ajout : administration des ventes. Sous-typologies proposées, à valider.
      code: 'ADV', libelle: 'ADV',
      sous: [
        { code: 'CMD', libelle: 'Commande', boite: 'adv@phenix-partner.fr' },
        { code: 'ELM', libelle: 'Éléments manquants', boite: 'adv@phenix-partner.fr' },
        { code: 'POR', libelle: 'Portabilité', boite: 'adv@phenix-partner.fr' },
        { code: 'RES', libelle: 'Résiliation', boite: 'adv@phenix-partner.fr' },
        { code: 'SUS', libelle: 'Suspension', boite: 'adv@phenix-partner.fr' },
        { code: 'RED', libelle: 'Redimensionnement', boite: 'adv@phenix-partner.fr' }
      ]
    }
  ];

  /* ---------- Workflow : 6 états ---------- */
  // actif : le ticket est en cours de traitement (filtre par défaut de la liste)
  // tranche : une décision a été rendue (date de résolution renseignée)
  PHX.ETATS = [
    { code: 'OUV', libelle: 'Ouvert', actif: true },
    { code: 'ARP', libelle: 'Attente retour partenaire', actif: true },
    { code: 'AAR', libelle: 'Attente arbitrage', actif: true },
    { code: 'RES', libelle: 'Résolu', tranche: true },
    { code: 'REJ', libelle: 'Rejeté', tranche: true },
    { code: 'FER', libelle: 'Fermé', tranche: true, clos: true }
  ];

  /* ---------- Transitions autorisées (proposition à valider) ----------
   * Règles complémentaires appliquées par l'écran :
   *  - un ticket doit avoir un agent responsable pour changer d'état ;
   *  - tout changement d'état exige un commentaire ;
   *  - seul un manager fait sortir un ticket de « Attente arbitrage » ;
   *  - « Fermé » est définitif (lecture seule).
   */
  PHX.TRANSITIONS = {
    OUV: ['ARP', 'AAR', 'RES', 'REJ'],
    ARP: ['OUV', 'AAR', 'RES', 'REJ'],
    AAR: ['OUV', 'ARP', 'RES', 'REJ'],
    RES: ['FER', 'OUV'],
    REJ: ['FER', 'OUV'],
    FER: []
  };

  /* ---------- Profils simulés (RG-15 : accès aux montants) ---------- */
  PHX.PROFILS = {
    agent: { login: 'a.martin', nom: 'A.MARTIN', groupe: 'SERVICE CLIENT R&F', libelle: 'Agent Réclamation & Facturation', montants: true },
    manager: { login: 'm.garnier', nom: 'M.GARNIER', groupe: 'MANAGER R&F', libelle: 'Manager Réclamation & Facturation', montants: true },
    autre: { login: 'j.lambert', nom: 'J.LAMBERT', groupe: 'COMMERCIAL', libelle: 'Autre équipe (commercial)', montants: false }
  };

  /* ---------- Agents fictifs, par équipe ---------- */
  PHX.EQUIPES = {
    'a.martin': 'Service Client R&F', 's.benali': 'Service Client R&F', 'c.durand': 'Service Client R&F',
    'k.haddad': 'Delivery', 'l.moreau': 'Delivery', 'n.petit': 'Mobility', 'r.fontaine': 'Mobility',
    'e.girard': 'Facturation', 'y.bernard': 'Recouvrement', 'f.roux': 'Recouvrement',
    'h.mercier': 'ADV', 'o.dupuis': 'ADV',
    'm.garnier': 'Manager R&F', 'j.lambert': 'Commercial', 'p.henry': 'Exploitation'
  };

  // Recouvrement : cause d'une créance non recouvrable (le reste dû est alors compté irrécouvrable)
  PHX.CAUSES_IRRECOUVRABLES = ['Compte clos', 'Facture indue', 'Liquidation judiciaire'];

  PHX.MOTIFS_REJET = [
    'Provision insuffisante', 'Compte clôturé', 'Opposition du débiteur',
    'Mandat inexistant ou révoqué', 'Coordonnées bancaires erronées'
  ];

  /* ---------- Catalogue des champs = source des colonnes ----------
   * code     : identifiant technique du champ
   * libelle  : libellé affiché en en-tête de colonne et dans l'export
   * type     : id | datetime | date | etat | agent | texte | nombre | montant | booleen
   * defaut   : true = colonne affichée par défaut, toujours présente
   * portee   : typologie (et sous-typologies) pour lesquelles le champ existe
   * sensible : true = montant soumis à RG-15 (profils habilités uniquement)
   * siVide   : valeur affichée quand le champ est applicable mais vide
   * options  : liste de valeurs proposées à la saisie (type multi : choix multiple)
   * modifManager : après la création du ticket, seul un manager peut modifier le champ
   * creation : false = champ renseigné pendant le traitement, absent du formulaire de création
   * aide     : info-bulle sur l'en-tête
   */
  PHX.CHAMPS_BASE = [
    // Colonnes par défaut (ordre fixe)
    { code: 'id', libelle: 'N° ticket', type: 'id', defaut: true },
    { code: 'dateCreation', libelle: 'Date création', type: 'datetime', defaut: true },
    { code: 'dateMaj', libelle: 'Date mise à jour', type: 'datetime', defaut: true, aide: 'Date du dernier commentaire' },
    { code: 'dateResolution', libelle: 'Date résolution', type: 'date', defaut: true, aide: 'Date de passage en Résolu ou Rejeté' },
    { code: 'etat', libelle: 'État', type: 'etat', defaut: true },
    { code: 'agent', libelle: 'Agent', type: 'agent', defaut: true },
    { code: 'partenaireCode', libelle: 'Code partenaire', type: 'texte', defaut: true },
    { code: 'partenaireRS', libelle: 'Partenaire', type: 'texte', defaut: true, aide: 'Raison sociale' },

    // Informations générales
    { code: 'typologie', libelle: 'Typologie', type: 'texte' },
    { code: 'sousTypologie', libelle: 'Sous-typologie', type: 'texte' },
    { code: 'objet', libelle: 'Objet', type: 'texte' },
    { code: 'createur', libelle: 'Créé par', type: 'agent' },
    { code: 'boite', libelle: 'Boîte notifiée', type: 'texte' },
    { code: 'nbDM', libelle: 'Demandes de modification', type: 'nombre', aide: 'Nombre de demandes de modification rattachées' },

    // Réclamation › Facturation (CDC § 4.3.1 + avoir accordé)
    { code: 'numFacture', libelle: 'N° de facture', type: 'texte', portee: { typo: 'REC', sous: ['FAC'] } },
    { code: 'avoirDemande', libelle: 'Avoir demandé', type: 'booleen', portee: { typo: 'REC', sous: ['FAC'] } },
    { code: 'montantReclame', libelle: 'Montant réclamé HT', type: 'montant', sensible: true, portee: { typo: 'REC', sous: ['FAC'] } },
    { code: 'avoirAccorde', creation: false, libelle: 'Avoir accordé', type: 'booleen', portee: { typo: 'REC', sous: ['FAC'] }, aide: 'Renseigné au passage en Résolu ou Rejeté' },
    { code: 'montantAvoirHT', creation: false, libelle: 'Montant avoir HT', type: 'montant', sensible: true, portee: { typo: 'REC', sous: ['FAC'] } },

    // Réclamation › SAV et Déploiement : services impactés (choix multiple).
    // modifManager : saisi librement à la création, modifiable ensuite par un manager uniquement.
    { code: 'servicesImpactes', libelle: 'Services impactés', type: 'multi', options: ['Fixe', 'DATA', 'GSM', 'Autre'],
      portee: { typo: 'REC', sous: ['SAV', 'DEP'] }, modifManager: true, aide: 'Choix multiple, modifiable par un manager une fois le ticket créé' },

    // Réclamation, toutes sous-typologies : geste commercial (cumulable avec un avoir)
    { code: 'gesteAccorde', creation: false, libelle: 'Geste co accordé', type: 'booleen', portee: { typo: 'REC' }, aide: 'Geste commercial, renseigné au passage en Résolu ou Rejeté' },
    { code: 'montantGesteHT', creation: false, libelle: 'Montant geste co HT', type: 'montant', sensible: true, portee: { typo: 'REC' } },

    // Recouvrement (CDC § 4.3.2 + montant recouvré)
    { code: 'numFactureImpayee', libelle: 'N° facture impayée', type: 'texte', portee: { typo: 'RCV' } },
    { code: 'montantHTReclame', libelle: 'Montant HT réclamé', type: 'montant', sensible: true, portee: { typo: 'RCV' } },
    { code: 'montantRecouvreHT', creation: false, libelle: 'Montant recouvré HT', type: 'montant', sensible: true, siVide: 0, portee: { typo: 'RCV' }, aide: '0 € si rien n\u2019a été recouvré' },
    { code: 'causeIrrecouvrable', creation: false, libelle: 'Cause irrécouvrable', type: 'texte', options: PHX.CAUSES_IRRECOUVRABLES, portee: { typo: 'RCV' }, aide: 'Le reste dû est alors compté irrécouvrable' },
    { code: 'dateEcheance', libelle: 'Date d\u2019échéance', type: 'date', portee: { typo: 'RCV', sous: ['IMP'] } },
    { code: 'motifRejet', libelle: 'Motif du rejet', type: 'texte', options: PHX.MOTIFS_REJET, portee: { typo: 'RCV', sous: ['REJ'] } },
    { code: 'dateRejet', libelle: 'Date du rejet', type: 'date', portee: { typo: 'RCV', sous: ['REJ'] } },
    { code: 'rum', libelle: 'Référence mandat (RUM)', type: 'texte', portee: { typo: 'RCV', sous: ['REJ'] } }
  ];

  /* =====================================================================
   * Demandes de modification (CDC § 4.6), sur le modèle de la page
   * « Demandes Clients » de Netcom : un type de demande = un formulaire.
   * Comme pour les tickets, les formulaires sont générés depuis ce
   * référentiel : ajouter un type ou un champ ne demande pas de développement d'écran.
   * ===================================================================== */
  PHX.STATUTS_DM = [
    { code: 'ATT', libelle: 'En attente' },
    { code: 'VAL', libelle: 'Validée' },
    { code: 'REA', libelle: 'Réalisée', clos: true },
    { code: 'REF', libelle: 'Refusée', clos: true },
    { code: 'ANN', libelle: 'Annulée', clos: true }
  ];
  // Proposition à valider : une demande close (Réalisée, Refusée, Annulée) est définitive.
  PHX.TRANSITIONS_DM = { ATT: ['VAL', 'REF', 'ANN'], VAL: ['REA', 'ANN'], REA: [], REF: [], ANN: [] };

  var SERVICES = ['DATA', 'VOIP', 'GSM'];
  PHX.DESTINATIONS = ['France – fixe', 'France – mobile', 'Europe (zone 1)', 'Europe (zone 2)', 'Maghreb', 'Afrique', 'Amérique du Nord', 'Asie', 'Reste du monde'];
  var service = { code: 'service', libelle: 'Service', type: 'liste', options: SERVICES, obligatoire: true };

  // montants : le type comporte des montants (RG-15 : réservé aux profils habilités)
  // libelleDate / dateObligatoire : libellé et caractère obligatoire de la date d'effet pour ce type
  // regle : contrôle particulier appliqué à l'ajout
  PHX.TYPES_DM = [
    { code: 'REM', libelle: 'Remises', court: 'Remise', montants: true, libelleDate: 'À partir du', dateObligatoire: true, regle: 'montantOuPourcentage',
      champs: [service,
        { code: 'duree', libelle: 'Durée', type: 'nombre', unite: 'mois', obligatoire: true },
        { code: 'montant', libelle: 'Montant', type: 'montant', sensible: true },
        { code: 'pourcentage', libelle: 'Pourcentage', type: 'pourcentage' }] },
    { code: 'AVO', libelle: 'Avoirs', court: 'Avoir', montants: true,
      champs: [service,
        { code: 'montant', libelle: 'Montant', type: 'montant', sensible: true, obligatoire: true },
        { code: 'factures', libelle: 'Facture(s) concernée(s)', type: 'texte', obligatoire: true },
        { code: 'urgent', libelle: 'Urgent – partenaire en impayé', type: 'case' },
        { code: 'geste', libelle: 'Geste commercial accordé', type: 'case' }] },
    { code: 'DIV', libelle: 'Divers', court: 'Divers',
      champs: [{ code: 'nature', libelle: 'Type', type: 'liste', options: ['Divers', 'Statut', 'Créance perdue'], obligatoire: true }] },
    { code: 'TAR', libelle: 'Tarifs', court: 'Tarif', montants: true,
      champs: [{ code: 'service', libelle: 'Service', type: 'liste', options: ['VOIP', 'GSM'], obligatoire: true },
        { code: 'destination', libelle: 'Destination', type: 'liste', options: PHX.DESTINATIONS, obligatoire: true },
        { code: 'montant', libelle: 'Montant', type: 'montant', sensible: true, obligatoire: true, aide: 'Tarif à la minute' }] }
  ];

  // Champs communs à toutes les demandes (CDC § 4.6.1, adapté) :
  // objet et demandeur sont figés, un seul champ de commentaire.
  PHX.CHAMPS_COMMUNS_DM = [
    { code: 'objet', libelle: 'Objet', type: 'fige', aide: 'Généré : type de demande et n° de ticket' },
    { code: 'demandeur', libelle: 'Demandeur', type: 'fige', aide: 'Agent qui crée la demande' },
    { code: 'perimetre', libelle: 'Périmètre concerné', type: 'texte', aide: 'Lignes, services ou contrats concernés' },
    { code: 'dateEffet', libelle: 'Date souhaitée de prise d’effet', type: 'date' },
    { code: 'commentaire', libelle: 'Commentaire', type: 'zone', obligatoire: true }
  ];
  PHX.objetDM = function (typeCode, ticketId) {
    var T = PHX.typeDM(typeCode);
    return (T ? T.court : typeCode) + ' – ticket n° ' + ticketId;
  };

  PHX.typeDM = function (code) {
    for (var i = 0; i < PHX.TYPES_DM.length; i++) if (PHX.TYPES_DM[i].code === code) return PHX.TYPES_DM[i];
    return null;
  };
  PHX.statutDM = function (code) {
    for (var i = 0; i < PHX.STATUTS_DM.length; i++) if (PHX.STATUTS_DM[i].code === code) return PHX.STATUTS_DM[i];
    return null;
  };

  /* ---------- Utilitaires de lecture du référentiel ---------- */
  PHX.typo = function (code) {
    for (var i = 0; i < PHX.TYPOLOGIES.length; i++) if (PHX.TYPOLOGIES[i].code === code) return PHX.TYPOLOGIES[i];
    return null;
  };
  PHX.sousTypo = function (typoCode, sousCode) {
    var t = PHX.typo(typoCode);
    if (!t) return null;
    for (var i = 0; i < t.sous.length; i++) if (t.sous[i].code === sousCode) return t.sous[i];
    return null;
  };
  PHX.etat = function (code) {
    for (var i = 0; i < PHX.ETATS.length; i++) if (PHX.ETATS[i].code === code) return PHX.ETATS[i];
    return null;
  };
  // Groupe d'affichage d'un champ dans le sélecteur de colonnes, déduit de sa portée
  PHX.groupeChamp = function (c) {
    if (!c.portee || !c.portee.typo) return 'Informations générales';
    var t = PHX.typo(c.portee.typo);
    var lib = t ? t.libelle : c.portee.typo;
    if (c.portee.sous && c.portee.sous.length) {
      lib += ' › ' + c.portee.sous.map(function (s) {
        var st = PHX.sousTypo(c.portee.typo, s);
        return st ? st.libelle : s;
      }).join(' / ');
    }
    return lib;
  };
})();

</script>
<script>
/*

      else if (rs() < 0.2) svc.push(OPTIONS_SVC[Math.floor(rs() * 3)]);
      t.champs.servicesImpactes = OPTIONS_SVC.filter(function (x) { return svc.indexOf(x) >= 0; });
    }
    var r = mulberry32(PHX.hash('histo#' + t.id));
    var H = 3600000, fin = ref - 6 * H;
    var ev = [];
    t.destinataires = [];
    if (r() < 0.2 && t.agent !== 'm.garnier') t.destinataires.push('m.garnier');
    if (r() < 0.15) t.destinataires.push('comptabilite@' + slug(t.partenaireRS) + '.example');
    var notifies = function () { return [t.agent].concat(t.destinataires).filter(function (x, i, a) { return x && a.indexOf(x) === i; }); };

    ev.push({ type: 'ouverture', date: t.dateCreation, auteur: t.createur, etatApres: 'OUV', typo: t.typo, sous: t.sous,
      servicesImpactes: t.champs.servicesImpactes ? t.champs.servicesImpactes.slice() : undefined,
      changements: [], commentaire: description(t), notifies: [t.boite] });
    if (t.agent) {
      var fin1 = t.dateResolution || t.dateMaj;
      var pec = heureBureau(t.dateCreation + Math.max(10 * 60000, (fin1 - t.dateCreation) * (0.05 + r() * 0.25)), r, t.dateCreation, Math.min(fin1, fin));
      ev.push({ type: 'maj', date: pec, auteur: t.agent, etatAvant: 'OUV', etatApres: 'OUV', changements: [{ code: 'agent', avant: null, apres: t.agent }], commentaire: 'Prise en charge du ticket.', notifies: [t.agent] });
      if (t.etat === 'OUV') {
        if (t.dateMaj - pec > H) ev.push({ type: 'maj', date: t.dateMaj, auteur: t.agent, etatAvant: 'OUV', etatApres: 'OUV', changements: [], commentaire: t.dernierCommentaire, notifies: notifies() });
      } else if (t.etat === 'ARP' || t.etat === 'AAR') {
        ev.push({ type: 'maj', date: Math.max(t.dateMaj, pec + 30 * 60000), auteur: t.agent, etatAvant: 'OUV', etatApres: t.etat, changements: [], commentaire: t.dernierCommentaire, notifies: notifies() });
      } else {
        var dr = t.dateResolution;
        if (dr - pec > 2 * JOUR && r() < 0.35) {
          ev.push({ type: 'maj', date: heureBureau(pec + (dr - pec) * 0.3, r, pec, dr), auteur: t.agent, etatAvant: 'OUV', etatApres: 'ARP', changements: [], commentaire: 'Demande de précisions envoyée au partenaire.', notifies: notifies() });
          ev.push({ type: 'maj', date: heureBureau(pec + (dr - pec) * 0.7, r, pec, dr), auteur: t.agent, etatAvant: 'ARP', etatApres: 'OUV', changements: [], commentaire: 'Retour du partenaire reçu, reprise du traitement.', notifies: notifies() });
        }
        var ch = [], c = t.champs;
        if (t.typo === 'REC' && t.sous === 'FAC') {
          ch.push({ code: 'avoirAccorde', avant: null, apres: c.avoirAccorde });
          if (c.montantAvoirHT) ch.push({ code: 'montantAvoirHT', avant: null, apres: c.montantAvoirHT });
        }
        if (t.typo === 'REC') {
          ch.push({ code: 'gesteAccorde', avant: null, apres: c.gesteAccorde });
          if (c.montantGesteHT) ch.push({ code: 'montantGesteHT', avant: null, apres: c.montantGesteHT });
        }
        if (t.typo === 'RCV' && c.montantRecouvreHT) ch.push({ code: 'montantRecouvreHT', avant: 0, apres: c.montantRecouvreHT });
        if (t.typo === 'RCV' && c.causeIrrecouvrable) ch.push({ code: 'causeIrrecouvrable', avant: null, apres: c.causeIrrecouvrable });
        ev.push({ type: 'maj', date: dr, auteur: t.agent, etatAvant: 'OUV', etatApres: t.decision, changements: ch, commentaire: commentaireDecision(t), notifies: notifies() });
        if (t.etat === 'FER') ev.push({ type: 'maj', date: t.dateFermeture, auteur: t.agent, etatAvant: t.decision, etatApres: 'FER', changements: [], commentaire: 'Ticket fermé après confirmation du partenaire.', notifies: notifies() });
      }
    }
    ev.sort(function (a, b) { return a.date - b.date; });
    var dernier = ev[ev.length - 1];
    t.dateMaj = dernier.date;
    t.dernierCommentaire = dernier.commentaire;
    t.historique = ev;
  }

  /* =====================================================================
   * Demandes de modification fictives, rattachées aux tickets qui en ont
   * (t.nbDM). La création de chaque demande est inscrite dans l'historique
   * de son ticket parent.
   * ===================================================================== */
  var COMMENTAIRES_DM = {
    VAL: 'Demande validée, transmise pour réalisation.',
    REA: 'Modification réalisée dans le système de facturation.',
    REF: 'Demande refusée : hors conditions contractuelles.',
    ANN: 'Demande annulée à la demande du partenaire.'
  };
  var PERIMETRES = ['Contrat cadre', 'Lien fibre du site principal', '3 lignes GSM', 'Trunk SIP principal', 'Toutes les lignes', 'Accès SDSL secondaire'];

  function choisirTypeDM(t, i, r) {
    var c = t.champs;
    if (t.typo === 'REC' && t.sous === 'FAC') {
      if (i === 0 && c.avoirAccorde) return { type: 'AVO', montant: c.montantAvoirHT, factures: c.numFacture };
      if (c.gesteAccorde) return { type: 'AVO', montant: c.montantGesteHT, factures: c.numFacture, geste: true };
      return { type: i === 0 ? 'DIV' : 'REM' };
    }
    if (t.typo === 'REC' && c.gesteAccorde && i === 0) return { type: 'AVO', montant: c.montantGesteHT, geste: true };
    var choix = { 'DEP/VOIP': ['DIV', 'TAR'], 'DEP/GSM': ['DIV', 'TAR'], 'DEP/DATA': ['DIV'] }[t.typo + '/' + t.sous] || ['DIV', 'DIV', 'REM'];
    return { type: choix[Math.floor(r() * choix.length)] };
  }

  PHX.genererDemandes = function (tickets, ref) {
    var H = 3600000, fin = ref - 6 * H;
    var demandes = [];
    // Demandes supplémentaires sur les tickets récents, pour alimenter le menu des demandes (statut « En attente »)
    tickets.forEach(function (t) {
      if (t.nbDM || !t.agent || t.typo === 'ADV') return;
      var rp = mulberry32(PHX.hash('dm+#' + t.id));
      var c = t.champs;
      if (t.etat === 'RES' && t.typo === 'REC' && (c.avoirAccorde || c.gesteAccorde)) t.nbDM = 1;
      else if (PHX.etat(t.etat).actif && rp() < 0.25) t.nbDM = 1;
    });
    tickets.forEach(function (t) {
      if (!t.nbDM) return;
      var r = mulberry32(PHX.hash('dm#' + t.id));
      for (var i = 0; i < t.nbDM; i++) {
        var ch = choisirTypeDM(t, i, r);
        var serviceDM = t.typo === 'DEP' ? t.sous : ['DATA', 'VOIP', 'GSM'][Math.floor(r() * 3)];
        // Date de création : après la résolution (ou pendant le traitement si le ticket est ouvert)
        var debut = t.dateResolution || t.historique[Math.min(1, t.historique.length - 1)].date;
        var limite = t.dateFermeture ? Math.min(t.dateFermeture - H, fin) : fin;
        var cre = heureBureau(debut + (0.5 + r() * 30) * H, r, debut, Math.max(debut + 10 * 60000, limite));
        var champs = { service: serviceDM };
        var commentaire;
        switch (ch.type) {
          case 'AVO':
            champs.montant = ch.montant; champs.factures = ch.factures || 'Dernière facture émise';
            champs.geste = !!ch.geste; champs.urgent = r() < 0.25;
            commentaire = ch.geste ? 'Émettre l’avoir correspondant au geste commercial accordé sur le ticket.' : 'Émettre l’avoir accordé suite à la réclamation du partenaire.';
            break;
          case 'REM':
            champs.duree = [3, 6, 12][Math.floor(r() * 3)]; champs.pourcentage = [5, 10, 15, 20][Math.floor(r() * 4)];
            commentaire = 'Appliquer une remise temporaire de ' + champs.pourcentage + ' % pendant ' + champs.duree + ' mois.';
            break;
          case 'TAR':
            champs.service = ['VOIP', 'GSM'][Math.floor(r() * 2)]; champs.destination = PHX.DESTINATIONS[Math.floor(r() * PHX.DESTINATIONS.length)];
            champs.montant = arrondi2(0.02 + r() * 0.13);
            commentaire = 'Appliquer le tarif négocié vers la destination indiquée.';
            break;
          default:
            champs = { nature: ['Statut', 'Divers', 'Divers'][Math.floor(r() * 3)] };
            commentaire = champs.nature === 'Statut' ? 'Mettre à jour le statut du partenaire suite au traitement du ticket.'
              : ['Corriger le paramétrage du service ' + serviceDM + ' sur le périmètre indiqué.', 'Mettre à jour l’option souscrite sur le périmètre indiqué.', 'Voir le ticket pour le contexte.'][Math.floor(r() * 3)];
        }
        var d = new Date(cre); d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0, 0, 0);
        var dm = {
          ticketId: t.id, partenaireCode: t.partenaireCode, partenaireRS: t.partenaireRS,
          type: ch.type, objet: PHX.objetDM(ch.type, t.id), perimetre: PERIMETRES[Math.floor(r() * PERIMETRES.length)],
          dateEffet: (ch.type === 'REM' || r() < 0.4) ? d.getTime() : null,
          demandeur: t.agent || t.createur, creePar: t.agent || t.createur, commentaire: commentaire,
          champs: champs, statut: 'ATT', dateCreation: cre, dateMaj: cre, dateCloture: null, cloturePar: null,
          journal: [{ date: cre, auteur: t.agent || t.createur, statutApres: 'ATT', commentaire: 'Création de la demande.', notifies: [t.agent || t.createur] }]
        };
        // Statut selon l'avancement du ticket
        var u = r(), cible;
        if (t.etat === 'FER') cible = u < 0.8 ? 'REA' : u < 0.9 ? 'REF' : 'ANN';
        else if (t.decision) cible = u < 0.5 ? 'ATT' : u < 0.75 ? 'VAL' : 'REA';
        else cible = u < 0.75 ? 'ATT' : 'VAL';
        var tVal = heureBureau(Math.min(cre + (2 + r() * 40) * H, fin), r, cre, fin);
        if ((cible === 'VAL' || cible === 'REA') && tVal > cre) {
          dm.journal.push({ date: tVal, auteur: 'm.garnier', statutAvant: 'ATT', statutApres: 'VAL', commentaire: COMMENTAIRES_DM.VAL, notifies: [dm.demandeur] });
          dm.statut = 'VAL'; dm.dateMaj = tVal;
        }
        if (cible === 'REA' || cible === 'REF' || cible === 'ANN') {
          var base = dm.dateMaj, tClo = heureBureau(Math.min(base + (4 + r() * 120) * H, fin), r, base, fin);
          if (tClo > base) {
            var com = COMMENTAIRES_DM[cible];
            var auteur = cible === 'REA' ? 'e.girard' : 'm.garnier';
            dm.journal.push({ date: tClo, auteur: auteur, statutAvant: dm.statut, statutApres: cible, commentaire: com, notifies: [dm.demandeur] });
            dm.statut = cible; dm.dateMaj = tClo; dm.dateCloture = tClo; dm.cloturePar = auteur;
          }
        }
        demandes.push(dm);
      }
    });
    demandes.sort(function (a, b) { return a.dateCreation - b.dateCreation; });
    var id = 12040;
    var parId = {};
    tickets.forEach(function (t) { parId[t.id] = t; });
    demandes.forEach(function (dm) {
      dm.id = ++id;
      // Trace de la création dans l'historique du ticket parent
      var t = parId[dm.ticketId];
      var avant = t.historique.filter(function (e) { return e.date <= dm.dateCreation; });
      var etat = avant.length ? avant[avant.length - 1].etatApres : 'OUV';
      t.historique.push({ type: 'maj', date: dm.dateCreation, auteur: dm.creePar, etatAvant: etat, etatApres: etat,
        changements: [{ code: 'demande', id: dm.id, typeDM: dm.type, objet: dm.objet }],
        commentaire: 'Demande de modification n° ' + dm.id + ' créée.', notifies: [t.agent].filter(Boolean) });
    });
    tickets.forEach(function (t) {
      if (!t.nbDM) return;
      t.historique.sort(function (a, b) { return a.date - b.date; });
      var dernier = t.historique[t.historique.length - 1];
      t.dateMaj = dernier.date;
      t.dernierCommentaire = dernier.commentaire;
    });
    return demandes;
  };

  /**
   * Valeur fictive pour un champ ajouté au référentiel pendant la démo.
   * Déterministe (même valeur à chaque rechargement).
   */
  PHX.valeurDemo = function (champ, t) {
    var r = mulberry32(PHX.hash(champ.code + '#' + t.id));
    if (r() > 0.65) return null; // le champ n'est pas renseigné sur tous les tickets
    switch (champ.type) {
      case 'montant': return arrondi2(50 + Math.pow(r(), 2) * 3000);
      case 'nombre': return 1 + Math.floor(r() * 20);
      case 'booleen': return r() < 0.5;
      case 'date': return t.dateCreation + Math.floor(r() * 20) * JOUR;
      default: return 'REF-' + String(1000 + Math.floor(r() * 8999));
    }
  };
})();

</script>
<script>
/*
 * Phenix – Module Tickets – Lot 1 – Simulation exécutable
 * Écrans couverts (étape 1) :
 *   #/menu     Menu Tickets (Afficher les tickets / Statistiques)
 *   #/tickets  Liste des tickets : filtres, colonnes personnalisées, export .csv
 *   #/stats    Statistiques : tableau de bord des traitements
 */
(function () {
  'use strict';
  const PHX = window.PHX;
  const JOUR = 86400000;

  /* =====================================================================
   * Utilitaires
   * ===================================================================== */
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.prototype.slice.call((el || document).querySelectorAll(s));
  const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const fmtEur = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
  const fmtNb = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
  const fmtPct = new Intl.NumberFormat('fr-FR', { style: 'percent', maximumFractionDigits: 1 });
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const fDate = (ts) => { if (ts === null || ts === undefined) return ''; const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
  const fDateHeure = (ts) => { if (ts === null || ts === undefined) return ''; const d = new Date(ts); return fDate(ts) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const parseIso = (s, fin) => {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const p = s.split('-'); const d = new Date(+p[0], +p[1] - 1, +p[2]);
    if (fin) d.setHours(23, 59, 59, 999);
    return d.getTime();
  };
  const pluriel = (n, mot) => n + ' ' + mot.split(' ').map((m) => m + (n > 1 ? 's' : '')).join(' ');

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
  }

  /* =====================================================================
   * Préférences (navigateur) : profil simulé, colonnes par utilisateur,
   * champs ajoutés au référentiel pendant la démo.
   * Cible SI : préférences de colonnes stockées par utilisateur en base.
   * ===================================================================== */
  const CLE = 'phenix-tickets-lot1';
  const VERSION_DONNEES = 3; // à incrémenter quand le jeu de données fictives change
  const store = { profil: 'agent', colonnes: {}, champsAjoutes: [], tickets: {}, demandes: {}, nouveaux: {} };
  function champValide(c) { return c && typeof c.code === 'string' && typeof c.libelle === 'string' && typeof c.type === 'string'; }
  function charger() {
    try {
      const s = window.localStorage.getItem(CLE);
      if (!s) return;
      const o = JSON.parse(s);
      if (!o || typeof o !== 'object') return;
      if (PHX.PROFILS[o.profil]) store.profil = o.profil;
      if (o.colonnes && typeof o.colonnes === 'object') store.colonnes = o.colonnes;
      if (Array.isArray(o.champsAjoutes)) store.champsAjoutes = o.champsAjoutes.filter(champValide);
      const memesDonnees = o.versionDonnees === VERSION_DONNEES;
      if (memesDonnees && o.tickets && typeof o.tickets === 'object') store.tickets = o.tickets;
      if (memesDonnees && o.demandes && typeof o.demandes === 'object') store.demandes = o.demandes;
      if (memesDonnees && o.nouveaux && typeof o.nouveaux === 'object') store.nouveaux = o.nouveaux;
    } catch (e) { /* stockage indisponible : la démo fonctionne sans mémoire */ }
  }
  function sauver() {
    try { window.localStorage.setItem(CLE, JSON.stringify(Object.assign({ versionDonnees: VERSION_DONNEES }, store))); } catch (e) { /* ignoré */ }
  }

  /* =====================================================================
   * Données
   * ===================================================================== */
  /* Jeu de données figé : généré pour une date de référence fixe (vendredi 2 octobre 2026),
   * puis décalé par semaines entières jusqu'à la semaine en cours. Les numéros de tickets
   * et de demandes restent ainsi identiques d'un jour à l'autre (les jours de semaine
   * sont conservés) et les mises à jour enregistrées dans le navigateur restent valables. */
  const REF_DEMO = new Date(2026, 9, 2).getTime();
  const AUJOURDHUI = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); })();
  const SEMAINES = Math.max(0, Math.floor(Math.round((AUJOURDHUI - REF_DEMO) / JOUR) / 7));
  const decaler = (ts) => { if (typeof ts !== 'number') return ts; const d = new Date(ts); d.setDate(d.getDate() + 7 * SEMAINES); return d.getTime(); };
  function decalerDonnees() {
    if (!SEMAINES) return;
    TICKETS.forEach((t) => {
      ['dateCreation', 'dateMaj', 'dateResolution', 'dateFermeture'].forEach((k) => { t[k] = decaler(t[k]); });
      ['dateEcheance', 'dateRejet'].forEach((k) => { if (k in t.champs) t.champs[k] = decaler(t.champs[k]); });
      t.historique.forEach((e) => { e.date = decaler(e.date); });
    });
    DEMANDES.forEach((d) => {
      ['dateCreation', 'dateMaj', 'dateCloture', 'dateEffet'].forEach((k) => { d[k] = decaler(d[k]); });
      d.journal.forEach((j) => { j.date = decaler(j.date); });
    });
  }
  const TICKETS = [];
  const PAR_ID = {};
  const DEMANDES = [];
  function genererDonnees() {
    TICKETS.length = 0;
    DEMANDES.length = 0;
    Object.keys(PAR_ID).forEach((k) => { delete PAR_ID[k]; });
    PHX.genererTickets(REF_DEMO).forEach((t) => { TICKETS.push(t); PAR_ID[t.id] = t; });
    PHX.genererDemandes(TICKETS, REF_DEMO).forEach((d) => DEMANDES.push(d));
    decalerDonnees();
  }
  genererDonnees();

  function appliquerChampsAjoutes() {
    store.champsAjoutes.forEach((c) => {
      TICKETS.forEach((t) => {
        if (!t.cree && applicable(c, t) && !(c.code in t.champs)) t.champs[c.code] = PHX.valeurDemo(c, t);
      });
    });
  }

  /* =====================================================================
   * Catalogue des champs -> colonnes
   * ===================================================================== */
  const GETTERS = {
    typologie: (t) => PHX.typo(t.typo).libelle,
    sousTypologie: (t) => PHX.sousTypo(t.typo, t.sous).libelle
  };
  const catalogue = () => PHX.CHAMPS_BASE.concat(store.champsAjoutes);
  function champ(code) {
    const cat = catalogue();
    for (let i = 0; i < cat.length; i++) if (cat[i].code === code) return cat[i];
    return null;
  }
  const profil = () => PHX.PROFILS[store.profil];
  const autorise = (c) => !c.sensible || profil().montants;
  const estSpecifique = (c) => !!(c.portee || c.ajoute);
  function applicable(c, t) {
    if (!c.portee || !c.portee.typo) return true;
    if (c.portee.typo !== t.typo) return false;
    if (c.portee.sous && c.portee.sous.length && c.portee.sous.indexOf(t.sous) < 0) return false;
    return true;
  }
  function valeur(c, t) {
    if (GETTERS[c.code]) return GETTERS[c.code](t);
    let v = estSpecifique(c) ? t.champs[c.code] : t[c.code];
    if ((v === undefined || v === null || v === '') && c.siVide !== undefined) v = c.siVide;
    return v === undefined ? null : v;
  }
  const colonnesDefaut = () => PHX.CHAMPS_BASE.filter((c) => c.defaut);
  function colonnesPerso() {
    const liste = store.colonnes[profil().login] || [];
    return liste.map(champ).filter((c) => c && !c.defaut && autorise(c));
  }
  const colonnesAffichees = () => colonnesDefaut().concat(colonnesPerso());

  const badgeEtat = (code) => {
    const e = PHX.etat(code);
    return '<span class="etat etat-' + esc(code) + '">' + esc(e ? e.libelle : code) + '</span>';
  };

  function celluleHtml(c, t) {
    if (!applicable(c, t)) return '<td title="Non applicable à cette typologie"></td>';
    const v = valeur(c, t);
    if (c.code === 'agent' && !v) return '<td><span class="nc-non-affecte">Non affecté</span></td>';
    if (Array.isArray(v)) return v.length ? '<td>' + esc(v.join(', ')) + '</td>' : '<td class="vide">—</td>';
    if (v === null || v === '') return c.defaut ? '<td></td>' : '<td class="vide">—</td>';
    if (c.code === 'partenaireCode') return '<td><a href="' + lienPartenaire(v) + '" title="Ouvrir la fiche partenaire (onglet Gestion)">' + esc(v) + '</a></td>';
    switch (c.type) {
      case 'id': return '<td><a href="#/ticket/' + esc(v) + '" class="lien-ticket" title="Ouvrir le ticket">' + esc(v) + '</a></td>';
      case 'datetime': return '<td>' + fDateHeure(v) + '</td>';
      case 'date': return '<td>' + fDate(v) + '</td>';
      case 'etat': return '<td>' + badgeEtat(v) + '</td>';
      case 'montant': return '<td class="num">' + esc(fmtEur.format(v)) + '</td>';
      case 'nombre': return '<td class="num">' + esc(v) + '</td>';
      case 'booleen': return '<td>' + (v ? 'Oui' : 'Non') + '</td>';
      default: return '<td' + (c.code === 'objet' ? ' class="objet"' : '') + '>' + esc(v) + '</td>';
    }
  }

  function valeurCsv(c, t) {
    if (!applicable(c, t)) return '';
    const v = valeur(c, t);
    if (c.code === 'agent' && !v) return 'Non affecté';
    if (v === null || v === undefined || v === '') return '';
    if (Array.isArray(v)) return v.join(', ');
    switch (c.type) {
      case 'datetime': return fDateHeure(v);
      case 'date': return fDate(v);
      case 'etat': return PHX.etat(v).libelle;
      case 'montant': return Number(v).toFixed(2).replace('.', ',');
      case 'booleen': return v ? 'Oui' : 'Non';
      default: return String(v);
    }
  }
